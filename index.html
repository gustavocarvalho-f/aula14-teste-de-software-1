<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Teste de Software - Atividade Prática</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Teste de Software - Formulário Validado</h2>

    <form id="formulario">
      <input type="text" id="nome" placeholder="Digite seu nome">
      <input type="text" id="email" placeholder="Digite seu e-mail">
      <input type="text" id="idade" placeholder="Digite sua idade">
      <button type="button" onclick="validarFormulario()">Enviar</button>
    </form>

    <p id="mensagem"></p>

    <hr>

    <h3>Teste de Unidade - Multiplicação</h3>
    <p>Abra o console (F12 → Console) para ver o resultado dos testes automatizados.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
